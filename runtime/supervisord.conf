[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/pi-chat-supervisord.pid
childlogdir=/tmp
umask=0077

[unix_http_server]
file=/tmp/pi-chat-supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/pi-chat-supervisor.sock

[program:bridge]
command=/opt/venv/bin/python -m bridge
directory=/opt/pi-chat
autostart=true
autorestart=unexpected
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=45
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Pi is an RPC child of the bridge, not a second independently started daemon.
; The bridge owns Pi's prompt pipes, checkpoints, process groups and shutdown.
