name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-ledger.txt -r requirements-web.txt
      - run: npm ci --prefix extensions --ignore-scripts --no-audit
      - run: npm ci --prefix tests/pi-sdk --ignore-scripts --no-audit
      - run: npm run --prefix tests/pi-sdk typecheck
      - run: python -m ruff check --select E4,E7,E9,F bridge tools tests
      - run: python -m mypy --follow-imports=silent --ignore-missing-imports bridge
      - run: python -m unittest discover -s tests/bridge -q
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: python -m unittest discover -s extensions/web-search -p 'test_*.py' -q
      - run: node --test tests/*.test.cjs extensions/web-search/*.test.mjs extensions/observability/pi-capture/test/*.test.mjs extensions/observability/pi-topic/test/*.test.mjs
        env:
          PI_TASKS_SDK_MODULE: ${{ github.workspace }}/tests/pi-sdk/node_modules/@earendil-works/pi-coding-agent/dist/index.js
      - run: bun test tests/room-lease.test.ts
      - run: node extensions/observability/pi-topic/test/extension-smoke.mjs
      - run: python tools/audit_export.py
